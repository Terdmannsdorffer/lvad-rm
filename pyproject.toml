[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvadrm"
version = "0.1.0"
description = "LVAD speed control with noisy reward machines on a JAX 0D cardiovascular model"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
